name: Publish

# Publishes every non-private workspace package whose package.json version is
# not on npm yet. `changeset publish` skips private packages and skips
# versions the registry already has. It passes `--access public` from
# `.changeset/config.json` and does not pass `--provenance`.
#
# Provenance is omitted on purpose. `npm publish --provenance` needs an OIDC
# token (`id-token: write`) so npm can ask Sigstore for a statement. That
# permission is what made an empty token fall through to trusted publishing
# and die ENEEDAUTH. This workflow never requests `id-token: write`.
#
# Triggers:
# - workflow_call — the Release workflow calls this after a push that changed
#   a package version. GITHUB_TOKEN-created releases do not fire `release`.
# - release: published — a GitHub Release created by a person.
# - workflow_dispatch — catch-up and retry.
#
# Auth is the repository secret NPM, passed to npm as NODE_AUTH_TOKEN.
# This workflow does not read NPM_TOKEN. Pull requests do not run it.

on:
  release:
    types: [published]
  workflow_dispatch:
  workflow_call:
    secrets:
      NPM:
        required: true

concurrency:
  group: npm-publish
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      NODE_AUTH_TOKEN: ${{ secrets.NPM }}

    steps:
      - name: Require the NPM secret
        run: |
          if [ -z "${NODE_AUTH_TOKEN}" ]; then
            echo "::error title=NPM secret missing::The repository secret NPM is empty or not set. Add an npm granular access token (read and write, Bypass 2FA) as the secret NPM on danielsimonjr/PhysJS, then re-run this job."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-tags: true

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          # 22.x, not 20.x: @changesets/cli v3 declares
          # engines.node '^22.11 || ^24 || >=26'. On Node 20 its bin.js dies with
          # `TypeError: enableCompileCache is not a function` before doing any work.
          node-version: 22.x
          registry-url: https://registry.npmjs.org

      - name: Confirm the npm token
        run: |
          echo "npm=$(command -v npm) $(npm --version); node=$(node --version)"
          npm whoami

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Publish unpublished versions
        run: |
          echo "changeset publish skips private packages and versions already on npm. Provenance is not requested."
          bunx changeset publish
