name = "PhysJS"
version = "0.1.0"
defaultTargets = ["PhysJS"]

[leanOptions]
pp.unicode.fun = true
autoImplicit = false
relaxedAutoImplicit = false

# Both requires are direct. Physlib (the library Daniel calls PhysLean) already
# depends on Mathlib; this package requires Mathlib itself so a Mathlib lemma
# is not reached only by accident through Physlib.
[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.34.1"

[[require]]
name = "Physlib"
git = "https://github.com/leanprover-community/physlib"
rev = "af484f78ee0701290595f8bf892b157b10d64940"

[[lean_lib]]
name = "PhysJS"
# `srcDir = "lean"` maps module `Clapeyron` to `lean/Clapeyron.lean` and
# module `PhysJS` to `lean/PhysJS.lean`. A file in `lean/` is not a
# submodule of `PhysJS`; that path is `lean/PhysJS/Clapeyron.lean`.
# TOML rejects an anonymous `.+` glob, and `PhysJS.+` walks `lean/PhysJS/`.
# `roots` therefore names every file. Globs default to one module per
# root, so `lake build` builds each file. `lean/PhysJS.lean` imports the
# others. Declarations stay in `namespace PhysJS...`, so theorem names
# do not change.
srcDir = "lean"
roots = [
  "AlfvenSpeed",
  "BornOverlap",
  "Chandrasekhar",
  "Clapeyron",
  "Coarsening",
  "CompositeHiggs",
  "Crossing",
  "Deflection",
  "Dimensional",
  "Eddington",
  "EffectiveTemperature",
  "Einstein",
  "EinsteinCartan",
  "EinsteinRelation",
  "Entanglement",
  "EntropyProduction",
  "FastMagnetosonic",
  "Fret",
  "GravitationalRedshift",
  "HawkingUnruh",
  "Inequalities",
  "Jarzynski",
  "Jeans",
  "JohnsonNyquist",
  "Josephson",
  "KelvinRelation",
  "KgOscillator",
  "KgSchrodinger",
  "KibbleZurek",
  "KleinGordonWave",
  "Kss",
  "Landauer",
  "Laughlin",
  "Lindblad",
  "Mond",
  "OscillatorDictionary",
  "Pendulum",
  "PhysJS",
  "PlanckArea",
  "PlaneWave",
  "QuantumBounce",
  "QuantumCritical",
  "QuantumHall",
  "RadiationPressure",
  "RandallSundrum",
  "ScalarWave",
  "Shapiro",
  "Sommerfeld",
  "StiffString",
  "TelegraphDiffusion",
  "TelegraphWave",
  "ThermalDeBroglie",
  "TimeSymmetric",
  "TolmanEhrenfest",
  "ToricCode",
  "VacuumFriedmann",
  "WaveDalembert",
  "YangMills",
]
