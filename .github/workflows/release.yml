name: Release

# Versions the public workspace packages with changesets. There is no publish
# step and no npm token here; nobody publishes by hand.
#
# On a push to main with pending `.changeset/*.md` files, changesets/action
# opens or updates the "chore: release packages" pull request. GitHub lets the
# workflow open that pull request only while the repository setting "Allow
# GitHub Actions to create and approve pull requests" is on; with it off, the
# Version job fails at that step. With no changesets pending, the step does
# nothing.
#
# The Version job runs only when some workspace package is public (not
# `"private": true`); `.changeset/config.json` does not version private
# packages. Pull requests do not run this workflow.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  public:
    name: Find public packages
    runs-on: ubuntu-latest
    outputs:
      any: ${{ steps.scan.outputs.any }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: List workspace packages that are not private
        id: scan
        run: |
          public=$(jq -r 'select(.private != true) | .name' core/package.json functions/package.json)
          if [ -n "${public}" ]; then
            echo "public packages:"
            echo "${public}"
            echo "any=true" >> "$GITHUB_OUTPUT"
          else
            echo "every workspace package is private; nothing to version"
            echo "any=false" >> "$GITHUB_OUTPUT"
          fi

  version:
    name: Version
    needs: public
    if: needs.public.outputs.any == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          # @changesets/cli v3 needs Node 22.11 or later.
          node-version: 22.x

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Create Release Pull Request
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          pr-title: 'chore: release packages'
          commit-message: 'chore: release packages'
          version-script: bun run version-packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
