name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Installs, builds, typechecks, tests, lints and checks formatting. It does not publish.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workspace:
    name: bun workspace
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Type check
        run: bun run typecheck

      - name: Test (bun test per package, then vitest)
        run: bun run test

      - name: Lint
        run: bun run lint

      - name: Format check
        run: bun run format:check
