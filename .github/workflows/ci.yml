name: CI

on:
  push:
    branches: [main]
  # Every pull request, including one stacked on another PhysJS branch.
  pull_request:
  workflow_dispatch:

# This workflow builds and audits. It does not push, tag, or publish.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: lake build and axiom audit
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # `lake build` with the Mathlib cache, then an axiom audit.
      # Sources are flat: `lean/<Name>.lean` is module `<Name>` (`srcDir = "lean"`).
      # `lean/PhysJS.lean` is the module `PhysJS`. There is no `lean/PhysJS/` directory.
      # `axiom-audit-root` is the Lean module `PhysJS`, not a filesystem path.
      # The audit fails if any declaration in that module depends on `sorryAx`
      # (`sorry` / `admit`), `Lean.ofReduceBool` (`native_decide`), or any
      # axiom outside propext, Classical.choice, and Quot.sound.
      - name: Build and axiom audit
        uses: leanprover/lean-action@50fcf42d2e460296f1a34b402e990d1b24f8b596 # v1
        with:
          build: "true"
          test: "false"
          lint: "false"
          use-mathlib-cache: "true"
          axiom-audit: "true"
          axiom-audit-root: "PhysJS"
          axiom-audit-allow: "propext,Classical.choice,Quot.sound"
