name: Release

# Versions packages. npm publish is Publish (.github/workflows/publish.yml),
# called from this run when a push changed a public package version.
#
# Every workspace package is private in Tier 0, and changesets is configured
# not to version private packages, so this job does not open a release PR
# and does not call Publish until a later tier removes `"private": true`.
#
# Do not grant `id-token: write`. Publish authenticates with the repository
# secret NPM. Pull requests do not run this workflow.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    name: Version
    runs-on: ubuntu-latest
    outputs:
      versions_bumped: ${{ steps.versions.outputs.versions_bumped }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.x

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Create Release Pull Request
        id: changesets
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          pr-title: 'chore: release packages'
          commit-message: 'chore: release packages'
          version-script: bun run version-packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Detect a public version bump
        id: versions
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          bumped=false
          if [ -n "${BEFORE_SHA}" ] && [ "${BEFORE_SHA}" != "0000000000000000000000000000000000000000" ]; then
            if git diff --name-only "${BEFORE_SHA}" HEAD -- 'packages/*/package.json' | grep -q .; then
              before_private=$(git grep -l '"private": true' "${BEFORE_SHA}" -- 'packages/*/package.json' | wc -l)
              after_private=$(git grep -l '"private": true' HEAD -- 'packages/*/package.json' | wc -l)
              if [ "${before_private}" != "${after_private}" ]; then
                bumped=true
              fi
              if git diff "${BEFORE_SHA}" HEAD -- 'packages/*/package.json' | grep -E '^[+-]\s+"version":' | grep -q .; then
                if [ "${after_private}" -lt 10 ]; then
                  bumped=true
                fi
              fi
            fi
          fi
          echo "versions_bumped=${bumped}" >> "$GITHUB_OUTPUT"
          echo "versions_bumped=${bumped}"

  publish:
    name: Publish
    needs: release
    if: needs.release.outputs.versions_bumped == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/publish.yml
    secrets:
      NPM: ${{ secrets.NPM }}
