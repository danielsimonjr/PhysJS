name: TypeScript

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Installs, builds, typechecks, tests, lints, and packs. It does not publish.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workspace:
    name: bun workspace
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Type check
        run: bun run typecheck

      - name: Test
        run: bun test

      - name: Marker packages and core surface
        run: bun run check:markers

      - name: Manifest kinds match the Lean files
        run: bun run check:kinds

      - name: Manifest edits name the proofs package
        run: |
          git fetch origin "${{ github.base_ref || 'main' }}"
          bun scripts/check-proofs-changeset.ts "origin/${{ github.base_ref || 'main' }}"

      - name: Lint
        run: bun run lint

      - name: Format check
        run: bun run format:check

      - name: Pack dry run
        run: bun run pack:dry-run
