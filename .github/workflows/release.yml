name: Release

# Versions public workspace packages with changesets. PhysJS publishes nothing.
#
# Every workspace package is `"private": true`, and `.changeset/config.json`
# does not version private packages, so `changeset version` has nothing to do.
# Run anyway, the changesets action still tries to open a release pull request
# for the pending changesets, which GitHub Actions may not do in this
# repository, and the run fails. So the Version job runs only when some
# workspace package is public. While every package is private it is skipped.
#
# There is no publish step and no npm token. A tier that makes a package
# public adds publishing with it. Pull requests do not run this workflow.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  public:
    name: Find public packages
    runs-on: ubuntu-latest
    outputs:
      any: ${{ steps.scan.outputs.any }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: List workspace packages that are not private
        id: scan
        run: |
          public=$(jq -r 'select(.private != true) | .name' packages/*/package.json)
          if [ -n "${public}" ]; then
            echo "public packages:"
            echo "${public}"
            echo "any=true" >> "$GITHUB_OUTPUT"
          else
            echo "every workspace package is private; nothing to version"
            echo "any=false" >> "$GITHUB_OUTPUT"
          fi

  version:
    name: Version
    needs: public
    if: needs.public.outputs.any == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          # @changesets/cli v3 needs Node 22.11 or later.
          node-version: 22.x

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Create Release Pull Request
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          pr-title: 'chore: release packages'
          commit-message: 'chore: release packages'
          version-script: bun run version-packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
